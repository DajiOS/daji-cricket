# Run from the project root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment: { TRUST_PROXY: "1" }
    volumes: [ "daji-data:/data" ]
    expose: ["4000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment: { API_HOST: "${API_HOST:-api.dajicricket.com}" }
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config" ]
volumes: { daji-data: {}, caddy-data: {}, caddy-config: {} }
