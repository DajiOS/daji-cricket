# Deploys to the Lightsail server whenever main changes, but only after the server tests pass on that commit.
# Switched on by the repository variable DEPLOY_ENABLED=true and the secrets SERVER_HOST, SERVER_USER, SERVER_KEY.
# The code is copied to ~/cricket-booking on the server with rsync (the server needs no access to GitHub),
# then the same steps you ran by hand: docker compose up -d --build. .env files and data on the server are never touched,
# and files that were removed from the repo are left alone on the server.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  test:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Link the shared package
        run: mkdir -p server/node_modules/@daji && ln -s ../../../shared server/node_modules/@daji/shared
      - name: Test
        working-directory: server
        run: npm test
  deploy:
    needs: test
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Rebuild the key's layout: a pasted key often loses its line breaks or gains spaces or carriage returns.
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ['SERVER_KEY']
          m = re.search(r'-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----', raw, re.S)
          if not m:
              raise SystemExit('SERVER_KEY does not contain a BEGIN ... END private key block')
          body = re.sub(r'\s+', '', m.group(2))
          open(os.path.expanduser('~/.ssh/deploy_key'), 'w').write('-----BEGIN %s-----\n%s\n-----END %s-----\n' % (m.group(1), '\n'.join(textwrap.wrap(body, 70)), m.group(1)))
          PY
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo 'The SERVER_KEY secret is not a valid private key. Copy it again from the server with: cat ~/.ssh/gh_deploy'; exit 1; }
          ssh-keyscan -t ed25519 -T 10 "$SERVER_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Copy the code
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'mobile' \
            --exclude '.env' --exclude 'deploy/.env' --exclude 'data' --exclude '*.db' --exclude '*.db-wal' --exclude '*.db-shm' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$SERVER_USER@$SERVER_HOST:cricket-booking/"
      - name: Build and restart
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" '
            set -e
            cd ~/cricket-booking
            chmod -R a+rX server web shared
            # A 1 GB server with no swap freezes when memory runs out (30 Oct 2026); this adds swap once and is a no-op after
            sudo sh deploy/ensure-swap.sh
            cd deploy
            sudo docker compose up -d --build
            # Caddy reads its config once and retries failed HTTPS certificates slowly; restarting makes it pick up Caddyfile changes and ask for certificates straight away
            sudo docker compose restart caddy
            sudo docker image prune -f
            sudo docker compose ps
          '
