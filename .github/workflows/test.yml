# Runs the server tests on every push and pull request. Deploy (deploy.yml) runs the same tests first and stops if they fail.
name: Tests
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Link the shared package
        run: mkdir -p server/node_modules/@daji && ln -s ../../../shared server/node_modules/@daji/shared
      - name: Test
        working-directory: server
        run: npm test
