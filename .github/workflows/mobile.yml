# The phone app (Expo). On every pull request that touches mobile/, check the types and, if an Expo token is set, publish a preview
# update that reviewers open in Expo Go or a preview build (a link appears as a comment). On main, publish to the production and preview channels of both apps.
# Needs one repository secret: EXPO_TOKEN (expo.dev, Account settings, Access tokens). Without it the check still runs and the publish steps are skipped.
name: Phone app
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: mobile
    env:
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Align packages to the Expo version
        run: npx expo install --check || true
      - name: Check the types
        run: npm run typecheck
      - name: Set up EAS
        if: env.HAS_EXPO == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Show which branch each app channel serves
        # read-only: an installed app asks for its channel; if a channel points at the wrong branch, published updates never reach phones
        if: env.HAS_EXPO == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          for ch in production-admin production-customer preview-admin preview-customer; do
            echo "== channel $ch"; eas channel:view "$ch" --non-interactive || true
          done
          eas update:list --branch production-admin --non-interactive --limit 3 || true
      - name: Publish a preview update
        if: env.HAS_EXPO == 'true' && github.event_name == 'pull_request'
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --branch pr-${{ github.event.number }}
          working-directory: mobile
      - name: Publish to production
        if: env.HAS_EXPO == 'true' && github.event_name == 'push'
        # eas update does not read the env blocks of eas.json build profiles, so each update gets the same
        # EXPO_PUBLIC_APP_ENV / EXPO_PUBLIC_API_URL its build profile has. Without them the app refuses to connect (envGuard.ts).
        # --clear-cache: Metro caches the inlined EXPO_PUBLIC_ values, so without it a later branch can reuse an earlier branch's settings.
        run: |
          # each installed app asks its channel; the channel must point at the branch of the same name or no update reaches any phone
          # (until Oct 2026 none of the four channels pointed at a branch, so every published update was ignored)
          for ch in production-customer production-admin preview-customer preview-admin; do
            eas channel:edit "$ch" --branch "$ch" --non-interactive
          done
          export LIVE="EXPO_PUBLIC_APP_ENV=live EXPO_PUBLIC_API_URL=https://api.dajicricket.com"
          env $LIVE APP_VARIANT=customer eas update --branch production-customer --message "${{ github.event.head_commit.message }}" --non-interactive --clear-cache
          env $LIVE APP_VARIANT=admin eas update --branch production-admin --message "${{ github.event.head_commit.message }}" --non-interactive --clear-cache
          # the installable test builds (preview-customer / preview-admin profiles) listen on their own channels, so they get main too
          EXPO_PUBLIC_APP_ENV=test APP_VARIANT=customer eas update --branch preview-customer --message "${{ github.event.head_commit.message }}" --non-interactive --clear-cache
          EXPO_PUBLIC_APP_ENV=test APP_VARIANT=admin eas update --branch preview-admin --message "${{ github.event.head_commit.message }}" --non-interactive --clear-cache
