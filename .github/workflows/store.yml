# Store release for the phone apps, run by hand from the Actions tab. Builds the chosen app(s) for the App Store and Google Play on EAS
# and sends each finished build to TestFlight and the Play internal testing track (eas.json, submit profiles).
# The builds run on EAS without waiting, so this run going green does not mean the store took them: check the submission on expo.dev,
# or send the finished build again with build_id, which waits for the store's answer.
# Needs the EXPO_TOKEN repository secret, and the Apple and Google credentials saved in expo.dev (docs/APP_REVIEW.md, section 4).
name: Store release
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [both, customer, admin]
        default: both
      platform:
        description: Which store
        type: choice
        options: [all, ios, android]
        default: all
      build_id:
        description: Send an already finished build to the store instead of building (its id from expo.dev; set Which app to customer or admin, and Which store to ios or android)
        type: string
        default: ''
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Send a finished build
        if: inputs.build_id != ''
        env:
          APP_VARIANT: ${{ inputs.app }}
        run: eas submit --platform ${{ inputs.platform }} --id ${{ inputs.build_id }} --profile production-${{ inputs.app }} --non-interactive # waits for the store's answer, so a refused upload fails this run
      - name: Customer app
        if: inputs.build_id == '' && inputs.app != 'admin'
        continue-on-error: true # a failed store upload must not stop the admin build
        run: eas build --profile production-customer --platform ${{ inputs.platform }} --auto-submit-with-profile production-customer --non-interactive --no-wait
      - name: Admin app
        if: inputs.build_id == '' && inputs.app != 'customer'
        run: eas build --profile production-admin --platform ${{ inputs.platform }} --auto-submit-with-profile production-admin --non-interactive --no-wait
